Version: '2012-10-17'
Statement:
  - Sid: AllowGlobalUnrestrictedResourceActionsWhichIncurNoFees
    Effect: Allow
    Action:
      - dms:CreateEndpoint
      - dms:Describe*
      - dms:List*
      - dynamodb:Describe*
      - dynamodb:Get*
      - dynamodb:List*
      - dynamodb:Query
      - dynamodb:Scan
      - elasticache:Describe*
      - elasticache:List*
      - glacier:List*
      - glue:CreateConnection
      - glue:DeleteConnection
      - glue:Get*
      - glue:UpdateConnection
      - rds:Describe*
      - rds:List*
      - redshift:Describe*
    Resource: "*"

  - Sid: AllowGlobalRestrictedResourceActionsWhichIncurNoFees
    Effect: Allow
    Action:
      # Matches Create/Delete/ModifyReplicationSubnetGroup; DescribeReplicationSubnetGroups
      # does not match (ends in "Groups") (IAM action matching is case-insensitive)
      - dms:*ReplicationSubnetGroup
      - dms:AddTagsToResource
      - dms:DeleteEndpoint
      - dms:ModifyEndpoint
      - dms:RemoveTagsFromResource
      # Matches TagResource and UntagResource (IAM action matching is case-insensitive)
      - dynamodb:*TagResource
      - dynamodb:CreateTable
      - dynamodb:DeleteItem
      - dynamodb:DeleteTable
      - dynamodb:PutItem
      - dynamodb:UpdateContinuousBackups
      - dynamodb:UpdateItem
      - dynamodb:UpdateTable
      # Matches Create/Delete/ModifyCacheSubnetGroup; DescribeCacheSubnetGroups
      # does not match (ends in "Groups") (IAM action matching is case-insensitive)
      - elasticache:*CacheSubnetGroup
      - elasticache:AddTagsToResource
      - elasticache:CreateCacheSecurityGroup
      - elasticache:DeleteCacheCluster
      - elasticache:DeleteCacheSecurityGroup
      - elasticache:ModifyCacheCluster
      - elasticache:ModifyCacheParameterGroup
      - elasticache:RemoveTagsFromResource
      - glacier:AddTagsToVault
      - glacier:CreateVault
      - glacier:DeleteVault
      - glacier:RemoveTagsFromVault
      # Matches Create/Delete/Failover/Modify/Promote*/Reboot/Start/StopDBCluster;
      # also matches PromoteReadReplicaDBCluster. DescribeDBClusters does not match
      # (ends in "Clusters"). RestoreDBCluster* actions end in other suffixes.
      # FailoverDBCluster is additionally granted but is safe in test context.
      # CreateDBCluster is already granted in the IncurFees section.
      - rds:*DBCluster
      # Matches Copy/Create/DeleteDBClusterSnapshot; DescribeDBClusterSnapshots
      # does not match (ends in "Snapshots") (IAM action matching is case-insensitive)
      - rds:*DBClusterSnapshot
      # Matches Create/Delete/Modify/Reboot/Start/StopDBInstance; DescribeDBInstances
      # does not match (ends in "Instances"). RestoreDBInstance* actions end in other suffixes
      - rds:*DBInstance
      # Matches Copy/Create/DeleteDBSnapshot; DescribeDBSnapshots does not match
      # (ends in "Snapshots"). RestoreDBInstanceFromDBSnapshot also matches but is
      # already granted via RestoreDBInstance* (IAM action matching is case-insensitive)
      - rds:*DBSnapshot
      # Matches Create/Delete/ModifyDBSubnetGroup; DescribeDBSubnetGroups does not match
      # (ends in "Groups") (IAM action matching is case-insensitive)
      - rds:*DBSubnetGroup
      - rds:AddTagsToResource
      - rds:CancelExportTask
      - rds:CreateDBClusterParameterGroup
      - rds:CreateDBInstanceReadReplica
      - rds:CreateDBParameterGroup
      - rds:CreateOptionGroup
      - rds:DeleteDBClusterParameterGroup
      - rds:DeleteDBParameterGroup
      - rds:DeleteOptionGroup
      - rds:ModifyDBClusterParameterGroup
      - rds:ModifyDBParameterGroup
      - rds:ModifyOptionGroup
      - rds:PromoteReadReplica
      - rds:RemoveTagsFromResource
      # Matches RestoreDBClusterFromS3/FromSnapshot/ToPointInTime; no other
      # RestoreDBCluster* actions exist (IAM action matching is case-insensitive)
      - rds:RestoreDBCluster*
      # Matches RestoreDBInstanceFromDBSnapshot/FromS3/ToPointInTime; no other
      # RestoreDBInstance* actions exist (IAM action matching is case-insensitive)
      - rds:RestoreDBInstance*
      - rds:StartExportTask
      # Matches CreateTags and DeleteTags
      - redshift:*Tags
      - redshift:CreateClusterSubnetGroup
      - redshift:DeleteCluster
      - redshift:DeleteClusterSubnetGroup
      - redshift:ModifyCluster
      - redshift:ModifyClusterSubnetGroup
      - redshift:RebootCluster
    Resource:
      - 'arn:aws:dms:{{ aws_region }}:{{ aws_account_id }}:endpoint:*'
      - 'arn:aws:dms:{{ aws_region }}:{{ aws_account_id }}:subgrp:*'
      - 'arn:aws:dynamodb:{{ aws_region }}:{{ aws_account_id }}:table/*'
      - 'arn:aws:elasticache:{{ aws_region }}:{{ aws_account_id }}:cluster:*'
      - 'arn:aws:elasticache:{{ aws_region }}:{{ aws_account_id }}:parametergroup:*'
      - 'arn:aws:elasticache:{{ aws_region }}:{{ aws_account_id }}:securitygroup:*'
      - 'arn:aws:elasticache:{{ aws_region }}:{{ aws_account_id }}:subnetgroup:*'
      - 'arn:aws:glacier:{{ aws_region }}:{{ aws_account_id }}:vaults/*'
      - 'arn:aws:rds:{{ aws_region }}:{{ aws_account_id }}:cluster-pg:*'
      - 'arn:aws:rds:{{ aws_region }}:{{ aws_account_id }}:cluster-snapshot:*'
      - 'arn:aws:rds:{{ aws_region }}:{{ aws_account_id }}:cluster:*'
      - 'arn:aws:rds:{{ aws_region }}:{{ aws_account_id }}:db:*'
      - 'arn:aws:rds:{{ aws_region }}:{{ aws_account_id }}:og:*'
      - 'arn:aws:rds:{{ aws_region }}:{{ aws_account_id }}:pg:*'
      - 'arn:aws:rds:{{ aws_region }}:{{ aws_account_id }}:snapshot:*'
      - 'arn:aws:rds:{{ aws_region }}:{{ aws_account_id }}:subgrp:*'
      - 'arn:aws:redshift:{{ aws_region }}:{{ aws_account_id }}:cluster:*'
      - 'arn:aws:redshift:{{ aws_region }}:{{ aws_account_id }}:subnetgroup:*'

  - Sid: AllowGlobalRestrictedResourceActionsWhichIncurFees
    Effect: Allow
    Action:
      - elasticache:CreateCacheCluster
      - rds:CreateDBCluster
      - redshift:CreateCluster
    Resource:
      - 'arn:aws:elasticache:{{ aws_region }}:{{ aws_account_id }}:cluster:*'
      - 'arn:aws:elasticache:{{ aws_region }}:{{ aws_account_id }}:parametergroup:*'
      - 'arn:aws:elasticache:{{ aws_region }}:{{ aws_account_id }}:securitygroup:*'
      - 'arn:aws:elasticache:{{ aws_region }}:{{ aws_account_id }}:subnetgroup:*'
      - 'arn:aws:rds:{{ aws_region }}:{{ aws_account_id }}:cluster:*'
      - 'arn:aws:rds:{{ aws_region }}:{{ aws_account_id }}:subgrp:*'
      - 'arn:aws:redshift:{{ aws_region }}:{{ aws_account_id }}:cluster:*'

  # This allows AWS Services to automatically create their Default Service Linked Roles
  # These have fixed policies and can only be assumed by the service itself.
  - Sid: AllowServiceLinkedRoleCreation
    Effect: Allow
    Action:
      - iam:CreateServiceLinkedRole
    Resource:
      - 'arn:aws:iam::{{ aws_account_id }}:role/aws-service-role/elasticache.amazonaws.com/AWSServiceRoleForElastiCache'
      - 'arn:aws:iam::{{ aws_account_id }}:role/aws-service-role/kafka.amazonaws.com/AWSServiceRoleForKafka'
    Condition:
      ForAnyValue:StringEquals:
        iam:AWSServiceName:
          - 'elasticache.amazonaws.com'
          - 'kafka.amazonaws.com'

  - Sid: AllowKafkaActions
    Effect: Allow
    Action:
      # Matches TagResource and UntagResource (IAM action matching is case-insensitive)
      - kafka:*TagResource
      - kafka:CreateCluster
      - kafka:CreateConfiguration
      - kafka:DeleteCluster
      - kafka:DeleteConfiguration
      - kafka:Describe*
      - kafka:Get*
      - kafka:List*
      - kafka:RebootBroker
      - kafka:UpdateBrokerCount
      - kafka:UpdateBrokerStorage
      - kafka:UpdateBrokerType
      - kafka:UpdateClusterConfiguration
      - kafka:UpdateClusterKafkaVersion
      - kafka:UpdateConfiguration
      - kafka:UpdateMonitoring
    Resource: "*"
