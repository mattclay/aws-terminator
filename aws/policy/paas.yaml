Version: '2012-10-17'
Statement:

  # Merged AllowUnrestrictedResourceActionsWhichIncurFees into this section
  # to save policy size.
  - Sid: AllowGlobalUnrestrictedResourceActionsWhichIncurFees
    Effect: Allow
    Action:
      - cloudfront:CreateDistribution
      - cloudfront:CreateStreamingDistribution*
      - ecs:CreateCluster
    Resource:
      - "*"

  # Merged AllowUnrestrictedResourceActionsWhichIncurNoFees into this section
  # to save policy size.
  - Sid: AllowGlobalUnrestrictedResourceActionsWhichIncurNoFees
    Effect: Allow
    Action:
      - bedrock:Get*
      - bedrock:List*
      - cloudfront:CreateCloudFrontOriginAccessIdentity
      - cloudfront:Get*
      - cloudfront:List*
      # Matches TagResource and UntagResource (IAM action matching is case-insensitive)
      - ecs:*TagResource
      - ecs:DeregisterTaskDefinition
      - ecs:Describe*
      - ecs:List*
      - ecs:PutAccountSetting
      - ecs:RegisterTaskDefinition
      - lambda:GetEventSourceMapping
      - lambda:List*
      - sagemaker:Describe*
      - sagemaker:List*
    Resource:
      - "*"

  # Merged AllowGlobalRestrictedResourceActionsWhichIncurFees (ECS) into this
  # section to save policy size.
  - Sid: AllowGlobalRestrictedResourceActionsWhichIncurFees
    Effect: Allow
    Action:
      - bedrock:Invoke*
      - ecs:*CapacityProvider*
      - ecs:CreateService
      - ecs:DeleteCluster
      - ecs:DeleteService
      - ecs:RunTask
      - ecs:StartTask
      - ecs:StopTask
      - ecs:UpdateCluster
      - ecs:UpdateService
      - eks:CreateCluster
      - eks:CreateNodegroup
      - eks:UpdateNodegroupConfig
      - lambda:InvokeFunction
      - lightsail:CreateInstances
      - lightsail:CreateInstanceSnapshot
      - lightsail:StartInstance
    Resource:
      - 'arn:aws:bedrock:{{ aws_region }}::foundation-model/*'
      - 'arn:aws:bedrock:{{ aws_region }}:{{ aws_account_id }}:agent-alias/*'
      - 'arn:aws:ecs:{{ aws_region }}:{{ aws_account_id }}:*'
      - 'arn:aws:eks:{{ aws_region }}:{{ aws_account_id }}:cluster/*'
      - 'arn:aws:eks:{{ aws_region }}:{{ aws_account_id }}:nodegroup/*/*/*'
      - 'arn:aws:lambda:{{ aws_region }}:{{ aws_account_id }}:function:*'
      - 'arn:aws:lightsail:{{ aws_region }}:{{ aws_account_id }}:*'

  - Sid: AllowGlobalRestrictedResourceActionsWhichIncurNoFees
    Effect: Allow
    Action:
      - bedrock-agentcore:*AgentRuntime*
      - bedrock-agentcore:*AgentRuntimeEndpoint
      - bedrock-agentcore:*TagResource*
      - bedrock-agentcore:*WorkloadIdentity
      - bedrock:CreateAgent*
      - bedrock:CreateAgent*
      - bedrock:DeleteAgent*
      - bedrock:DisableAgentActionGroup
      - bedrock:PrepareAgent
      - bedrock:UpdateAgent*
      # Matches Create/Delete/UpdateCachePolicy; GetCachePolicy is already
      # covered by cloudfront:Get* in unrestricted (IAM action matching is case-insensitive)
      - cloudfront:*CachePolicy
      # Matches Create/Delete/UpdateOriginRequestPolicy; GetOriginRequestPolicy is already
      # covered by cloudfront:Get* in unrestricted (IAM action matching is case-insensitive)
      - cloudfront:*OriginRequestPolicy
      # Matches TagResource and UntagResource (IAM action matching is case-insensitive)
      - cloudfront:*TagResource
      - cloudfront:CreateInvalidation
      - cloudfront:DeleteCloudFrontOriginAccessIdentity
      - cloudfront:DeleteDistribution
      - cloudfront:DeleteStreamingDistribution
      - cloudfront:UpdateCloudFrontOriginAccessIdentity
      - cloudfront:UpdateDistribution
      # Matches Create/DeleteFargateProfile; DescribeFargateProfile is covered
      # by eks:Describe*. ListFargateProfiles does not match (ends in "Profiles")
      - eks:*FargateProfile
      # Matches TagResource and UntagResource (IAM action matching is case-insensitive)
      - eks:*TagResource
      - eks:DeleteCluster
      - eks:DeleteNodegroup
      - eks:Describe*
      - eks:List*
      - eks:UpdateNodegroupVersion
      # Matches Create/Delete/UpdateApplication; DescribeApplications does not match
      # (ends in "Applications"). *ApplicationVersion actions end in "Version"
      - elasticbeanstalk:*Application
      - elasticbeanstalk:Describe*
      # Matches Create/Delete/Get/UpdateAlias; ListAliases does not match
      # because it ends in "Aliases" not "Alias" (IAM action matching is case-insensitive)
      - lambda:*Alias
      # Matches TagResource and UntagResource (IAM action matching is case-insensitive)
      - lambda:*TagResource
      - lambda:AddPermission
      - lambda:CreateFunction
      - lambda:DeleteFunction
      - lambda:DeleteLayerVersion
      - lambda:GetFunction
      - lambda:GetFunctionConfiguration
      - lambda:GetLayerVersion
      - lambda:GetPolicy
      - lambda:PublishLayerVersion
      - lambda:RemovePermission
      - lambda:UpdateFunctionCode
      - lambda:UpdateFunctionConfiguration
      - lightsail:AllocateStaticIp
      - lightsail:CreateKeyPair
      - lightsail:DeleteInstance
      - lightsail:DeleteInstanceSnapshot
      - lightsail:DeleteKeyPair
      - lightsail:Get*
      - lightsail:PutInstancePublicPorts
      - lightsail:RebootInstance
      - lightsail:ReleaseStaticIp
      - lightsail:StopInstance
      # Matches Create/Delete/UpdateCodeRepository; DescribeCodeRepository is covered
      # by sagemaker:Describe*. ListCodeRepositories does not match (ends in "Repositories")
      - sagemaker:*CodeRepository
      # Matches Create/Delete/UpdateImage; DescribeImage is covered by sagemaker:Describe*.
      # ListImages does not match (ends in "Images"). *ImageVersion actions end in "Version"
      - sagemaker:*Image
      # Matches Create/DeleteModel; DescribeModel is covered by sagemaker:Describe*.
      # ListModels does not match (ends in "Models")
      - sagemaker:*Model
      # Matches AddTags and DeleteTags; ListTags also matches but is already
      # covered by sagemaker:List* in unrestricted (IAM action matching is case-insensitive)
      - sagemaker:*Tags
    Resource:
      - 'arn:aws:bedrock:{{ aws_region }}:{{ aws_account_id }}:agent-alias/*'
      - 'arn:aws:bedrock-agentcore:{{ aws_region }}:{{ aws_account_id }}:runtime/*'
      - 'arn:aws:bedrock-agentcore:{{ aws_region }}:{{ aws_account_id }}:workload-identity-directory/*'
      - 'arn:aws:bedrock:{{ aws_region }}:{{ aws_account_id }}:agent/*'
      # CloudFront is a global service (no region in ARNs)
      - 'arn:aws:cloudfront::{{ aws_account_id }}:cache-policy/*'
      - 'arn:aws:cloudfront::{{ aws_account_id }}:distribution/*'
      - 'arn:aws:cloudfront::{{ aws_account_id }}:origin-access-identity/*'
      - 'arn:aws:cloudfront::{{ aws_account_id }}:origin-request-policy/*'
      - 'arn:aws:cloudfront::{{ aws_account_id }}:streaming-distribution/*'
      - 'arn:aws:eks:{{ aws_region }}:{{ aws_account_id }}:cluster/*'
      - 'arn:aws:eks:{{ aws_region }}:{{ aws_account_id }}:fargateprofile/*/*/*'
      - 'arn:aws:eks:{{ aws_region }}:{{ aws_account_id }}:nodegroup/*/*/*'
      - 'arn:aws:elasticbeanstalk:{{ aws_region }}:{{ aws_account_id }}:application/*'
      - 'arn:aws:lambda:{{ aws_region }}:{{ aws_account_id }}:function:*'
      - 'arn:aws:lambda:{{ aws_region }}:{{ aws_account_id }}:layer:*'
      - 'arn:aws:lightsail:{{ aws_region }}:{{ aws_account_id }}:*'
      - 'arn:aws:sagemaker:{{ aws_region }}:{{ aws_account_id }}:code-repository/*'
      - 'arn:aws:sagemaker:{{ aws_region }}:{{ aws_account_id }}:image/*'

  - Sid: AllowUnrestrictedResourceActionsWhichIncurFees
    Effect: Allow
    Action:
      - cloudfront:CreateDistribution
      - cloudfront:CreateStreamingDistribution*
    Resource:
      - "*"

  - Sid: AllowUnrestrictedResourceActionsWhichIncurNoFees
    Effect: Allow
    Action:
      - bedrock-agentcore:Get*
      - bedrock-agentcore:List*
      - bedrock:Get*
      - bedrock:List*
      - cloudfront:CreateCloudFrontOriginAccessIdentity
      - cloudfront:Get*
      - cloudfront:List*
      - lambda:GetEventSourceMapping
      - lambda:List*
      - sagemaker:Describe*
      - sagemaker:List*
    Resource:
      - "*"
      - 'arn:aws:sagemaker:{{ aws_region }}:{{ aws_account_id }}:model/*'

  - Sid: AllowLambdaEventSourceMappings
    Effect: Allow
    Action:
      - lambda:CreateEventSourceMapping
      - lambda:DeleteEventSourceMapping
      - lambda:UpdateEventSourceMapping
    Resource:
      - "*"
    Condition:
      StringLike:
        lambda:FunctionArn:
          - arn:aws:lambda:{{ aws_region }}:{{ aws_account_id }}:function:*

  # Used to test some of the cross-account features
  - Sid: PermitReadOnlyThirdParty
    Effect: Allow
    Action:
      - SNS:Subscribe
      - SNS:Unsubscribe
    Resource:
      # https://aws.amazon.com/blogs/aws/subscribe-to-aws-public-ip-address-changes-via-amazon-sns/
      - 'arn:aws:sns:us-east-1:806199016981:AmazonIpSpaceChanged'
